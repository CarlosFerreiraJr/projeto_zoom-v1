<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom: um lugar para se conectar </title>
    <link rel="stylesheet" href="css/estilo.css">
    
</head>
<body>    
    <section class="fundo-azul">
        <header>
          <div class="header-conteudo">
            <a href="#">
                <img id="logo" src="img/logo-zoom-white.png" alt="Logo Zoom" width="100px"> 
            </a>    
           <nav>
                <ul>
                    <li><a href="#">Produtos</a></li>
                    <li><a href="#">Soluções</a></li>
                    <li><a href="#">Recursos</a></li>
                    <li><a href="#">Planos e Preços</a></li>
                </ul>
            </nav>    
            <div class="container-direito">
                <a class="botao" href="#">Entrar em contato com a equipe de vendas</a>
                <a class="botao destaque" href="#">Inscreva-se gratuitamente</a>
            </div>          
          </div>  
        </header>
    </section>
    <!-- Conteúdo que aparece ao rolar a tela (fundo branco) -->
    <main class="conteudo-pagina">
        <h2>Próxima seção</h2>
        <p>Este conteúdo já estará no fundo branco ao rolar a tela...</p>
        <br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br>
        <br><br><br><br><br><br><br><br><br>
    </main>    

    <script>
        window.addEventListener('scroll', function() {
            const header = document.querySelector('header');
            const logo = document.getElementById('logo'); // Seleciona a imagem da logo
            
            // Se rolar mais que a tela inicial
            if (window.scrollY > window.innerHeight * 0.8) {
                header.classList.add('rolado');
                logo.src = 'img/logo.svg'; // Troca para a logo azul/escura
            } else {
                header.classList.remove('rolado');
                logo.src = 'img/logo-zoom-white.png'; // Volta para a logo branca
            }
        });
    </script>
</body>
</html>
